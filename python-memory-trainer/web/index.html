<title>PyMem Python Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<style>
/* Layout: one narrow column like a flashcard deck on a desk. The card in play is the only framed object;
   everything else sits on the page. Type moves along one axis: casual for headings, linear for reading, mono for code. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #5a6678;
  --line: #d8dee7;
  --field-line: #8792a3;
  --accent: #2f67a8;
  --accent-ink: #ffffff;
  --accent-soft: #e4edf8;
  --learn: #9ab3d4;
  --mark: #ffd43b;
  --mark-soft: #fff4c7;
  --good: #1a7350;
  --good-soft: #e2f3ea;
  --bad: #b3392f;
  --bad-soft: #fbe6e3;
  --warn: #8f5b00;
  --warn-soft: #fcefd6;
  --code-bg: #f6f8fb;
  --shadow: rgba(20, 32, 51, 0.35);
  --t-kw: #8a3fbf;
  --t-str: #2b7a3e;
  --t-num: #a05600;
  --t-bi: #1d6c8a;
  --t-fn: #2f67a8;
  --t-com: #636e80;

  --font-display: "Recursive", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Recursive", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: "Recursive", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 1.75rem;
  --step-4: 2.25rem;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --ink: #e4ebf4; --muted: #97a3b6; --line: #273243; --field-line: #5d6a7e;
    --accent: #7eaae6; --accent-ink: #0e131a; --accent-soft: #1b2a3d; --learn: #3d5778;
    --mark: #f0c93a; --mark-soft: #3a3218;
    --good: #5bc893; --good-soft: #14302a; --bad: #f08b80; --bad-soft: #3b1f1e;
    --warn: #e8b65a; --warn-soft: #3a2e17; --code-bg: #10161f; --shadow: rgba(0, 0, 0, 0.55);
    --t-kw: #c99bf2; --t-str: #8fd19e; --t-num: #f2b36b; --t-bi: #7cc4de; --t-fn: #8db8f0; --t-com: #7d899b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --ink: #e4ebf4; --muted: #97a3b6; --line: #273243; --field-line: #5d6a7e;
  --accent: #7eaae6; --accent-ink: #0e131a; --accent-soft: #1b2a3d; --learn: #3d5778;
  --mark: #f0c93a; --mark-soft: #3a3218;
  --good: #5bc893; --good-soft: #14302a; --bad: #f08b80; --bad-soft: #3b1f1e;
  --warn: #e8b65a; --warn-soft: #3a2e17; --code-bg: #10161f; --shadow: rgba(0, 0, 0, 0.55);
  --t-kw: #c99bf2; --t-str: #8fd19e; --t-num: #f2b36b; --t-bi: #7cc4de; --t-fn: #8db8f0; --t-com: #7d899b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  font-variation-settings: "CASL" 0, "MONO" 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.shell {
  max-width: 40rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 2.5rem;
}

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  padding-block: 0.4rem; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand {
  flex: none; min-height: 44px;
  font: inherit; font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0;
  font-weight: 700; font-size: var(--step-1); color: var(--ink);
  background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center;
}
.brand .prompt { color: var(--accent); margin-right: 0.45ch; }
.caret {
  display: inline-block; width: 0.55ch; height: 1.05em; margin-left: 0.15ch;
  background: var(--mark); animation: blink 1.1s steps(1) infinite; vertical-align: -0.15em;
}
@keyframes blink { 50% { opacity: 0; } }
.top-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 0.25rem 0.5rem; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35em; white-space: nowrap;
  font-size: var(--step--1); font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px;
  background: var(--mark-soft); color: var(--ink);
}
.sync { font-size: var(--step--1); color: var(--muted); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sync::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.35rem; background: var(--muted); vertical-align: 0.05em; }
.sync[data-state="synced"]::before { background: var(--good); }
.sync[data-state="saving"]::before, .sync[data-state="connecting"]::before { background: var(--warn); }
.sync[data-state="error"] { color: var(--bad); font-weight: 600; }
.sync[data-state="error"]::before { background: var(--bad); }

/* ---------- type ---------- */
h1, h2, h3 { font-family: var(--font-display); font-variation-settings: "CASL" 1, "MONO" 0; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: var(--step-4); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: var(--step-2); font-weight: 750; }
h3 { font-size: var(--step-1); font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.mono { font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0; }
.num { font-variant-numeric: tabular-nums; }
.prose code {
  font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0; font-size: 0.92em;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.25em;
}

/* ---------- layout ---------- */
.view { display: flex; flex-direction: column; gap: 1.5rem; padding-top: 1.25rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
section { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }

/* ---------- buttons ---------- */
button { font: inherit; color: inherit; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 650; font-size: var(--step-0); border-radius: 12px; padding: 0.7rem 1.1rem;
  min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  touch-action: manipulation;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { width: 100%; font-size: var(--step-1); padding: 0.9rem 1.2rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 0.5rem; }
.btn[disabled] { opacity: 0.55; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
.grades.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grade {
  appearance: none; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer;
  padding: 0.55rem 0.25rem; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
  font-weight: 700; touch-action: manipulation;
}
.grade small { font-weight: 500; color: var(--muted); font-size: var(--step--1); }
.grade.again { color: var(--bad); }
.grade.hard { color: var(--warn); }
.grade.good { color: var(--good); }
.grade.easy { color: var(--accent); }
@media (hover: hover) {
  .btn:hover { border-color: var(--accent); }
  .btn.ghost:hover { border-color: transparent; text-decoration: underline; }
  .grade:hover { background: var(--accent-soft); }
}

/* ---------- home ---------- */
.today { display: flex; flex-direction: column; gap: 1rem; }
.today-counts { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; align-items: baseline; }
.count { display: flex; align-items: baseline; gap: 0.4rem; }
.count b { font-family: var(--font-display); font-variation-settings: "CASL" 1; font-size: var(--step-4); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.25rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.topic-chip {
  flex: none; appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 0.4rem 0.9rem; font-size: var(--step--1); font-weight: 600; cursor: pointer; min-height: 44px;
}
.topic-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.topics { display: flex; flex-direction: column; }
.topic-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.35rem 0.75rem; align-items: center;
  padding-block: 0.65rem; border-bottom: 1px solid var(--line);
}
.topic-row:last-child { border-bottom: 0; }
.topic-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-frac { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar span { display: block; height: 100%; }
.bar .m { background: var(--mark); }
.bar .r { background: var(--accent); }
.bar .l { background: var(--learn); }
.legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: var(--step--1); color: var(--muted); }
.legend i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px; margin-right: 0.35rem; vertical-align: -0.05em; }
.legend .m { background: var(--mark); }
.legend .r { background: var(--accent); }
.legend .l { background: var(--learn); }
.stats-line { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { border-radius: 12px; padding: 0.75rem 0.9rem; background: var(--accent-soft); font-size: var(--step--1); }
.note.warn { background: var(--bad-soft); }

/* ---------- session ---------- */
.session-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px var(--shadow);
}
.card.enter { animation: deal 0.28s ease-out; }
@keyframes deal { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem; font-size: var(--step--1); color: var(--muted); }
.kind { font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.boxes { display: inline-flex; gap: 3px; align-items: center; }
.boxes i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--muted); display: inline-block; }
.boxes i.on { background: var(--accent); border-color: var(--accent); }
.boxes.mastered i { background: var(--mark); border-color: var(--mark); }
.question { font-size: var(--step-1); font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.code {
  margin: 0; padding: 0.75rem 0.9rem; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0; font-size: 0.9375rem; line-height: 1.55;
  overflow-x: auto; white-space: pre; tab-size: 4; -webkit-overflow-scrolling: touch; min-width: 0;
}
.t-kw { color: var(--t-kw); font-weight: 600; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-bi { color: var(--t-bi); }
.t-fn { color: var(--t-fn); font-weight: 600; }
.t-com { color: var(--t-com); font-style: italic; }
.target { display: flex; flex-wrap: wrap; gap: 0.25rem 0.6rem; align-items: baseline; }
.target .code { padding: 0.35rem 0.6rem; flex: 1 1 12rem; }
.lbl { font-size: var(--step--1); font-weight: 600; color: var(--muted); }
.field, .code-input {
  width: 100%; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--field-line); border-radius: 10px; padding: 0.65rem 0.75rem;
}
.field.mono, .code-input { font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0; }
.field:focus, .code-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.out-lines { display: flex; flex-direction: column; gap: 0.4rem; }
.out-line { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); align-items: center; gap: 0.4rem; }
.out-line span { font-size: var(--step--1); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.code-input { min-height: 12rem; line-height: 1.5; resize: vertical; white-space: pre; overflow-x: auto; tab-size: 4; }
.keybar {
  display: flex; gap: 0.3rem; overflow-x: auto; padding: 0.3rem; margin-bottom: 0.4rem;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; scrollbar-width: none;
}
.keybar::-webkit-scrollbar { display: none; }
.key {
  flex: none; min-width: 44px; min-height: 44px; padding: 0 0.6rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation;
  font-family: var(--font-code); font-variation-settings: "MONO" 1, "CASL" 0; font-size: 1rem; font-weight: 600;
  -webkit-user-select: none; user-select: none;
}
.key.wide { font-family: var(--font-body); font-variation-settings: "MONO" 0; font-size: var(--step--1); }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.actions .btn.primary { flex: 1 1 10rem; }
.feedback { border-radius: 12px; padding: 0.85rem 0.95rem; display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.info { background: var(--accent-soft); }
.feedback .verdict { font-weight: 750; font-family: var(--font-display); font-variation-settings: "CASL" 1; font-size: var(--step-1); }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.feedback pre.msg {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-code);
  font-variation-settings: "MONO" 1; font-size: 0.875rem;
}
.answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .yours { color: var(--bad); }
.why { background: var(--mark-soft); border-radius: 12px; padding: 0.8rem 0.95rem; display: flex; flex-direction: column; gap: 0.3rem; }
.why .eyebrow { color: var(--ink); }
.why p { white-space: pre-wrap; overflow-wrap: anywhere; }
.pystatus { font-size: var(--step--1); color: var(--muted); display: inline-flex; align-items: baseline; gap: 0.35rem; max-width: 100%; }
.pystatus i { flex: none; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); display: inline-block; }
.pystatus[data-state="ready"] i { background: var(--good); }
.pystatus[data-state="loading"] i { background: var(--warn); animation: blink 1s steps(1) infinite; }
.pystatus[data-state="failed"] i { background: var(--bad); }

/* ---------- summary ---------- */
.score { font-family: var(--font-display); font-variation-settings: "CASL" 1; font-weight: 800; font-size: 3.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.missed { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.3rem; }

/* ---------- study sheet ---------- */
.browse-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem; }
select.field { appearance: auto; }
details.sheet { border-bottom: 1px solid var(--line); }
details.sheet summary {
  cursor: pointer; font-weight: 600; list-style: none; min-height: 44px; padding-block: 0.6rem;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center;
}
details.sheet summary::-webkit-details-marker { display: none; }
details.sheet summary .sum-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.sheet[open] summary .sum-text { white-space: normal; }
details.sheet > .stack { padding-bottom: 0.9rem; }

/* ---------- settings ---------- */
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; padding-block: 0.75rem; border-bottom: 1px solid var(--line); }
.setting select { width: auto; min-width: 5.5rem; }
.danger { color: var(--bad); border-color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  .caret, .pystatus[data-state="loading"] i { animation: none; }
  .card.enter { animation: none; }
  .progress span { transition: none; }
}
@media (min-width: 40rem) {
  .card { padding: 1.5rem; }
}
</style>

  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="PyMem, back to today"><span class="prompt">&gt;&gt;&gt;</span>pymem<span class="caret" aria-hidden="true"></span></button>
    <div class="top-meta">
      <span id="streak" class="chip num"></span>
      <span id="sync" class="sync" data-state="local" role="status">this device</span>
    </div>
  </header>

<script src="cards.js"></script>
<script>
"use strict";

// ===================================================================== data
const DATA = window.PYMEM_DATA;
const TOPICS = Object.fromEntries(DATA.topics.map((t) => [t.key, t.title]));
const CARDS = DATA.cards;
const BY_ID = new Map(CARDS.map((c) => [c.id, c]));
const KIND_LABEL = { concept: "recall", output: "predict the output", expr: "one-liner", code: "write code" };
const PRAISE = ["Nailed it!", "Correct!", "Yes!", "Spot on!", "Perfect."];

// Leitner boxes: same schedule as pymem.py
const INTERVALS = [0, 1, 3, 7, 14, 30];
const MASTERED = INTERVALS.length - 1;
const AGAIN = 0, HARD = 1, GOOD = 2, EASY = 3;

// ===================================================================== small helpers
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  return add(el, children);
}
// Append children, skipping null/false and flattening arrays (native append would print "null").
function add(el, ...children) {
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
const $ = (sel, root = document) => root.querySelector(sel);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
const plainText = (s) => (s || "").replace(/`/g, "");

// Dates are local calendar days as "YYYY-MM-DD", like the CLI.
function todayISO() {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
}
function addDays(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function fmtDay(iso, opts) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", opts);
}

//   fix    {k:"f", of: review event id, t}       "I was right (just a typo)"

// ===================================================================== scheduling
function reschedule(rec, grade, today) {
  let box = rec.box || 0, days;
  if (grade === AGAIN) { box = 0; days = 0; }
  else if (grade === HARD) { box = Math.max(box, 1); days = Math.max(1, Math.floor(INTERVALS[box] / 2)); }
  else { box = Math.min(box + (grade === EASY ? 2 : 1), MASTERED); days = INTERVALS[box]; }
  rec.box = box;
  rec.due = addDays(today, days);
  rec.seen = (rec.seen || 0) + 1;
  rec.right = (rec.right || 0) + (grade !== AGAIN ? 1 : 0);
}
function nextIntervalDays(rec, grade) {
  const box = rec ? rec.box : 0;
  if (grade === AGAIN) return 0;
  if (grade === HARD) return Math.max(1, Math.floor(INTERVALS[Math.max(box, 1)] / 2));
  return INTERVALS[Math.min(box + (grade === EASY ? 2 : 1), MASTERED)];
}

}
function dueCards(cards, day) {
  return cards.filter((c) => state.progress.cards[c.id] && state.progress.cards[c.id].due <= day);
}
function interleave(cards) {
  const byTopic = new Map();
  for (const c of cards) {
    if (!byTopic.has(c.topic)) byTopic.set(c.topic, []);
    byTopic.get(c.topic).push(c);
  }
  let queues = [...byTopic.values()];
  const out = [];
  while (queues.length) {
    for (const q of queues) out.push(q.shift());
    queues = queues.filter((q) => q.length);
  }
  return out;
}

  const cards = pool();
  const due = dueCards(cards, today).sort((a, b) =>
    state.progress.cards[a.id].due.localeCompare(state.progress.cards[b.id].due));
  const fresh = interleave(cards.filter((c) => !state.progress.cards[c.id]));
  const queue = due.slice(0, state.prefs.size);
  queue.push(...fresh.slice(0, Math.max(0, Math.min(state.prefs.newPer, state.prefs.size - queue.length))));
  return { queue: shuffle(queue), due: due.length, fresh: fresh.length };
}

  let day = today in hist ? today : addDays(today, -1);
  let n = 0;
  while (day in hist) { n++; day = addDays(day, -1); }
  return n;
}

  const n = streak(todayISO());
  $("#streak").textContent = n ? `🔥 ${n}-day streak` : "start a streak today";
}
function render() {
  renderedDay = todayISO();
  renderStreak();
  view.replaceChildren();
  if (state.view === "session" && state.session) renderSession();
  else if (state.view === "summary" && state.session) renderSummary();
  else if (state.view === "browse") renderBrowse();
  else if (state.view === "settings") renderSettings();
  else { state.view = "home"; renderHome(); }
}
function go(name) {
  state.view = name;
  render();
  window.scrollTo(0, 0);
}
$("#brand").addEventListener("click", () => {
  if (state.view === "session") endSession();
  else go("home");
});
function proseEl(tag, cls, html) { return h(tag, { class: `${cls} prose`, html }); }

// ---------------------------------------------------------------- home
function topicStats(key) {
  const cards = CARDS.filter((c) => c.topic === key);
  const counts = { m: 0, r: 0, l: 0, n: 0 };
  for (const c of cards) {
    const rec = state.progress.cards[c.id];
    if (!rec) counts.n++;
    else if (rec.box === MASTERED) counts.m++;
    else if (rec.box >= 2) counts.r++;
    else counts.l++;
  }
  return { total: cards.length, ...counts };
}
function renderHome() {
  const today = todayISO();
  const plan = planSession(today);
  const cards = pool();
  const fresh = plan.queue.filter((c) => !state.progress.cards[c.id]).length;

  const head = h("section", { class: "today" },
    h("p", { class: "eyebrow" }, fmtDay(today, { weekday: "long", day: "numeric", month: "long" })),
  );
  if (plan.queue.length) {
    add(head,
      h("div", { class: "today-counts" },
        h("span", { class: "count" }, h("b", {}, plan.queue.length - fresh), h("span", { class: "muted" }, "due")),
        h("span", { class: "count" }, h("b", {}, fresh), h("span", { class: "muted" }, "new")),
      ),
      h("button", { class: "btn primary big", type: "button", id: "start",
                    onclick: () => startSession(planSession(todayISO()).queue, false) },
        `Start review · ${plural(plan.queue.length, "card")}`),
      h("p", { class: "small muted" },
        `About ${Math.max(1, Math.round(plan.queue.length * 0.6))} min. Progress saves after every card.`),
    );
  } else {
    // Showing up on a day with nothing due still keeps the streak (recorded once per day).
    if (!(today in state.progress.history)) { Log.add({ k: "v", d: today }); renderStreak(); }
    const upcoming = cards.map((c) => state.progress.cards[c.id]).filter(Boolean).map((r) => r.due).sort()[0];
    add(head,
      h("h1", {}, "All caught up"),
      h("p", { class: "muted" }, upcoming ? `Next review: ${fmtDay(upcoming, { weekday: "long", day: "numeric", month: "short" })}.` : "No cards in these topics yet."),
      h("button", { class: "btn primary big", type: "button", onclick: () => startCram(cards, 10) }, "Practice 10 random cards"),
      h("p", { class: "small muted" }, "Practice doesn't change your schedule."),
    );
  }
  if (!state.localOk && !Sync.col) {
    add(head, h("p", { class: "note warn save-status" }, saveStatusText()));
  }

  const chips = h("div", { class: "chips", role: "group", "aria-label": "Topics to study" },
    h("button", { class: "topic-chip", type: "button", "aria-pressed": String(!state.prefs.topics.length),
                  onclick: () => { state.prefs.topics = []; savePrefs(); render(); } }, "All topics"),
    DATA.topics.map((t) => h("button", {
      class: "topic-chip", type: "button", "aria-pressed": String(state.prefs.topics.includes(t.key)),
      onclick: () => {
        const set = new Set(state.prefs.topics);
        set.has(t.key) ? set.delete(t.key) : set.add(t.key);
        state.prefs.topics = DATA.topics.map((x) => x.key).filter((k) => set.has(k));
        savePrefs(); render();
      },
    }, t.key)),
  );

  const rows = DATA.topics.map((t) => {
    const s = topicStats(t.key);
    const seg = (cls, n) => n ? h("span", { class: cls, style: `width:${(100 * n / s.total).toFixed(2)}%` }) : null;
    return h("div", { class: "topic-row" },
      h("span", { class: "topic-name" }, t.title),
      h("span", { class: "topic-frac" }, `${s.m}/${s.total} mastered`),
      h("div", { class: "bar", role: "img", "aria-label": `${t.title}: ${s.m} mastered, ${s.r} reviewing, ${s.l} learning, ${s.n} new` },
        seg("m", s.m), seg("r", s.r), seg("l", s.l)),
    );
  });

  const all = Object.values(state.progress.cards);
  const reviews = Object.values(state.progress.history).reduce((a, b) => a + b, 0);
  const mastered = all.filter((r) => r.box === MASTERED).length;

  add(view,
    head,
    h("section", {},
      h("div", { class: "spread" }, h("h2", {}, "Topics"), h("span", { class: "small muted num" }, `${cards.length} cards selected`)),
      chips,
    ),
    h("section", {},
      h("div", { class: "spread" }, h("h2", {}, "Progress"),
        h("div", { class: "legend" },
          h("span", {}, h("i", { class: "m" }), "mastered"),
          h("span", {}, h("i", { class: "r" }), "reviewing"),
          h("span", {}, h("i", { class: "l" }), "learning"))),
      h("div", { class: "topics" }, rows),
      h("div", { class: "stats-line" },
        h("span", {}, `${CARDS.length} cards`), h("span", {}, `${all.length} started`),
        h("span", {}, `${mastered} mastered`), h("span", {}, `${reviews} reviews`)),
    ),
    h("section", {},
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: () => go("browse") }, "Study sheet"),
        h("button", { class: "btn", type: "button", onclick: () => go("settings") }, "Settings")),
      pyStatusEl(),
    ),
  );
}

// ---------------------------------------------------------------- session
function startSession(queue, cram) {
  if (!queue.length) return;
  state.session = { today: todayISO(), queue: queue.map((c) => c.id), index: 0, retried: [], results: [], cram, undo: null };
  if (queue.some((c) => c.kind === "expr" || c.kind === "code")) Py.start();
  go("session");
}
function startCram(cards, n) { startSession(shuffle(cards.slice()).slice(0, n), true); }

function currentCard() { return BY_ID.get(state.session.queue[state.session.index]); }

function boxesEl(rec) {
  const box = rec ? rec.box : -1;
  return h("span", { class: "boxes" + (box === MASTERED ? " mastered" : ""), "aria-label": rec ? `box ${box} of ${MASTERED}` : "new card" },
    INTERVALS.map((_, i) => h("i", { class: i <= box ? "on" : "" })));
}

function renderSession() {
  const s = state.session;
  const card = currentCard();
  const rec = state.progress.cards[card.id];
  const done = s.index;
  const top = h("div", { class: "session-top" },
    h("button", { class: "btn ghost", type: "button", onclick: endSession }, "← End session"),
    h("span", { class: "small muted num" }, `${Math.min(done + 1, s.queue.length)} / ${s.queue.length}`),
  );
  const bar = h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(s.queue.length), "aria-valuenow": String(done) },
    h("span", { style: `width:${(100 * done / s.queue.length).toFixed(1)}%` }));
  const el = h("article", { class: "card enter", "aria-live": "polite" },
    h("div", { class: "card-meta" },
      h("span", { class: "kind" }, KIND_LABEL[card.kind]),
      h("span", {}, TOPICS[card.topic]),
      h("span", { class: "row", style: "gap:0.35rem" }, boxesEl(rec), rec ? null : h("span", {}, "new"),
        s.cram ? h("span", {}, "· practice") : null),
    ),
  );
  add(view, h("div", { class: "stack" }, top, bar), el);
  const ui = { card, el, rec };
  ({ concept: askConcept, output: askOutput, expr: askExpr, code: askCode })[card.kind](ui);
  if (card.kind === "expr" || card.kind === "code") add(view, pyStatusEl());
}

function codeBlock(html) { return h("pre", { class: "code", html }); }
function whyEl(card) {
  return card.whyHtml ? h("div", { class: "why" }, h("span", { class: "eyebrow" }, "Why"), proseEl("p", "", card.whyHtml)) : null;
}
function feedback(kind, verdict, ...body) {
  return h("div", { class: `feedback ${kind}`, role: "status" }, h("span", { class: "verdict" }, verdict), body);
}
function focusSoon(el) { if (el && window.matchMedia("(hover: hover)").matches) setTimeout(() => el.focus(), 30); }

// Each answer is logged right away (so quitting never loses it); the typo override adds a "fix" event.
function applyGrade(card, grade) {
  const s = state.session;
  const eventId = Log.add(s.cram ? { k: "r", c: card.id, g: grade, d: s.today, x: 1 } : { k: "r", c: card.id, g: grade, d: s.today });
  s.results.push({ id: card.id, grade });
  let requeued = false;
  if (grade === AGAIN && !s.retried.includes(card.id)) {
    s.retried.push(card.id);
    s.queue.push(card.id);
    requeued = true;
  }
  s.undo = { id: card.id, eventId, requeued };
}
function overrideToGood(card) {
  const s = state.session;
  const u = s.undo;
  if (!u || u.id !== card.id) return;
  Log.add({ k: "f", of: u.eventId });
  s.results[s.results.length - 1].grade = GOOD;
  if (u.requeued) {
    s.queue.splice(s.queue.lastIndexOf(card.id), 1);
    s.retried = s.retried.filter((id) => id !== card.id);
  }
  s.undo = null;
}
function next() {
  const s = state.session;
  s.undo = null;
  s.index++;
  if (s.index >= s.queue.length) go("summary");
  else { render(); window.scrollTo(0, 0); }
}
function endSession() {
  const s = state.session;
  if (s && s.results.length) go("summary");
  else { state.session = null; go("home"); }
}

// After any graded answer: either "Next" (right) or "Continue / I was right" (missed).
function afterAnswer(ui, grade, { overridable = true } = {}) {
  applyGrade(ui.card, grade);
  const row = h("div", { class: "actions" });
  if (grade === AGAIN) {
    add(row, h("button", { class: "btn primary", type: "button", onclick: next }, "Continue"));
    if (overridable) {
      add(row, h("button", { class: "btn ghost", type: "button", onclick: () => { overrideToGood(ui.card); next(); } },
        "I was right (just a typo)"));
    }
    const note = state.session.undo && state.session.undo.requeued
      ? h("p", { class: "small muted" }, "This one comes back at the end of the session.") : null;
    add(ui.el, row, note);
  } else {
    add(row, h("button", { class: "btn primary", type: "button", onclick: next },
      state.session.index + 1 >= state.session.queue.length ? "Finish" : "Next card"));
    add(ui.el, row);
  }
  focusSoon(row.querySelector("button"));
}
function gradeButtons(rec, onGrade, three = false) {
  const defs = [[AGAIN, "Again", "again"], [HARD, "Hard", "hard"], [GOOD, "Good", "good"], [EASY, "Easy", "easy"]];
  let used = false;  // a double tap must not grade twice
  return h("div", { class: "grades" + (three ? " three" : "") },
    defs.filter(([g]) => !three || g !== EASY).map(([g, label, cls]) =>
      h("button", { class: `grade ${cls}`, type: "button", "data-grade": String(g + 1),
                    onclick: () => { if (!used) { used = true; onGrade(g); } } },
        label, h("small", {}, dayLabel(nextIntervalDays(rec, g))))));
}

// ---------------------------------------------------------------- recall
function askConcept(ui) {
  const { card, el } = ui;
  const input = h("textarea", { class: "field", id: "concept-answer", rows: "3", placeholder: "Your answer (optional, helps it stick)",
                                autocapitalize: "sentences", spellcheck: "false" });
  const reveal = h("button", { class: "btn primary", type: "button", id: "reveal" }, "Show answer");
  const actions = h("div", { class: "actions" }, reveal);
  add(el, proseEl("p", "question", card.qHtml), h("label", { class: "lbl", for: "concept-answer" }, "Try it from memory first"), input, actions);
  reveal.addEventListener("click", () => {
    actions.remove();
    input.readOnly = true;
    const grades = gradeButtons(ui.rec, (g) => {
      grades.remove();
      applyGrade(card, g);
      next();
    });
    add(el,
      h("div", { class: "feedback info" }, h("span", { class: "eyebrow" }, "Answer"), proseEl("p", "answer-text", card.answerTextHtml)),
      whyEl(card),
      h("p", { class: "lbl" }, "How well did you know it?"),
      grades,
    );
    focusSoon(grades.querySelector(".good"));
  });
  focusSoon(input);
}

// ---------------------------------------------------------------- predict the output
// Same rules as pymem.py: leading padding counts when the real output has it; other spacing
// differences are forgiven, except inside quoted strings and between two words.
const QUOTED_OR_SPACE = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\s+/g;
const leadSpace = (s) => s.length - s.trimStart().length;
function squash(s) {
  const text = s.trim();
  return text.replace(QUOTED_OR_SPACE, (m, quoted, offset) => {
    if (quoted) return quoted;
    const before = text[offset - 1] || "", after = text[offset + m.length] || "";
    return /\w/.test(before) && /\w/.test(after) ? " " : "";
  });
}
function compareOutput(got, expected, raises) {
  got = got.map((g) => plainPython(g).replace(/\s+$/, ""));
  if (raises && got.length) {
    const name = expected[expected.length - 1];
    if (got[got.length - 1].trim().split(":")[0].trim() === name) got[got.length - 1] = name;
  }
  if (got.length !== expected.length) return { ok: false, got };
  if (got.every((g, i) => (leadSpace(expected[i]) ? g === expected[i] : g.trim() === expected[i].trim()))) return { ok: true, got };
  if (got.every((g, i) => (leadSpace(expected[i]) === 0 || leadSpace(g) === leadSpace(expected[i])) && squash(g) === squash(expected[i]))) {
    return { ok: true, note: "Only the spacing differs.", got };
  }
  return { ok: false, got };
}
function askOutput(ui) {
  const { card, el } = ui;
  const n = card.out.length;
  const inputs = card.out.map((_, i) => h("input", {
    class: "field mono", type: "text", id: `out-${i}`, autocapitalize: "off", autocorrect: "off", autocomplete: "off",
    spellcheck: "false", enterkeyhint: i === n - 1 ? "done" : "next", "aria-label": `Output line ${i + 1}`,
  }));
  const check = h("button", { class: "btn primary", type: "button", id: "check" }, "Check");
  const show = h("button", { class: "btn ghost", type: "button" }, "Show answer");
  const actions = h("div", { class: "actions" }, check, show);
  add(el,
    h("p", { class: "question" }, "What does this print?"),
    codeBlock(card.codeHtml),
    h("p", { class: "small muted" }, `${plural(n, "line")} of output. If it raises, type the exception name, like TypeError.`),
    h("div", { class: "out-lines" }, inputs.map((inp, i) => h("div", { class: "out-line" }, h("span", {}, n > 1 ? i + 1 : "›"), inp))),
    actions,
  );
  inputs.forEach((inp, i) => inp.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    if (i < n - 1) inputs[i + 1].focus(); else check.click();
  }));
  let settled = false;
  const finish = (gaveUp) => {
    if (settled) return;
    settled = true;
    actions.remove();
    inputs.forEach((inp) => { inp.readOnly = true; });
    const result = gaveUp ? { ok: false, got: null } : compareOutput(inputs.map((x) => x.value), card.out, card.raises);
    if (result.ok) {
      add(el, feedback("good", pick(PRAISE), result.note ? h("p", { class: "small" }, result.note) : null,
        result.note ? h("pre", { class: "code" }, card.out.join("\n")) : null), whyEl(card));
      afterAnswer(ui, GOOD);
      return;
    }
    const lines = h("pre", { class: "code diff" });
    card.out.forEach((line, i) => {
      lines.append(line + "\n");
      const mine = result.got && result.got[i];
      if (mine != null && compareOutput([mine], [line], false).ok === false) {
        lines.append(h("span", { class: "yours" }, `${mine.trim() || "(empty)"}   ← yours`), "\n");
      }
    });
    add(el, feedback(gaveUp ? "info" : "bad", gaveUp ? "Here's the output" : "Not quite. It prints:", lines), whyEl(card));
    afterAnswer(ui, AGAIN, { overridable: !gaveUp });
  };
  check.addEventListener("click", () => finish(false));
  show.addEventListener("click", () => finish(true));
  focusSoon(inputs[0]);
}

// ---------------------------------------------------------------- one-liner & write code (shared flow)
function selfCheck(ui, answerEl) {
  // Python couldn't start in this browser: show the reference and let you grade yourself.
  add(ui.el,
    feedback("info", "Check it yourself", h("p", { class: "small" }, "Python couldn't start in this browser, so compare with the reference answer:"), answerEl),
    whyEl(ui.card),
    h("p", { class: "lbl" }, "Was yours right?"),
  );
  const grades = gradeButtons(ui.rec, (g) => {
    grades.remove();
    applyGrade(ui.card, g);
    next();
  }, true);
  add(ui.el, grades);
}
function runAttempts(ui, { getAnswer, kind, answerEl, praiseExtra, lockInput }) {
  const { card, el } = ui;
  const check = h("button", { class: "btn primary", type: "button", id: "check" }, "Check");
  const show = h("button", { class: "btn ghost", type: "button" }, "Show answer");
  const actions = h("div", { class: "actions" }, check, show);
  const status = h("div", { class: "stack", "aria-live": "polite" });
  add(el, actions, status);
  let attempt = 0;
  let settled = false;  // the card got its grade: late results from a slow check are ignored

  const reveal = (gaveUp) => {
    if (settled) return;
    settled = true;
    actions.remove();
    lockInput();
    add(el, feedback(gaveUp ? "info" : "bad", gaveUp ? "The answer" : "Here's one way to write it", answerEl()), whyEl(card));
    afterAnswer(ui, AGAIN, { overridable: !gaveUp });
  };

  check.addEventListener("click", async () => {
    const answer = getAnswer();
    if (settled || !answer.trim()) return;
    check.disabled = true;
    status.replaceChildren(h("p", { class: "small muted" },
      Py.state === "ready" ? "Checking…" : "Starting Python. The first start downloads about 14 MB."));
    const result = await Py.check(kind, card, answer);
    if (settled || !el.isConnected) return;  // you moved on (Show answer, End session) while it ran
    check.disabled = false;
    status.replaceChildren();
    if (result === null) {
      settled = true;
      actions.remove();
      lockInput();
      selfCheck(ui, answerEl());
      return;
    }
    attempt++;
    if (result.ok) {
      settled = true;
      actions.remove();
      lockInput();
      add(el, feedback("good", pick(PRAISE), praiseExtra ? praiseExtra(answer) : null), whyEl(card));
      afterAnswer(ui, attempt === 1 ? GOOD : HARD);
      return;
    }
    if (attempt >= 2) {
      status.append(feedback("bad", "Still not it", h("pre", { class: "msg" }, result.msg)));
      reveal(false);
      return;
    }
    status.append(feedback("bad", "Not quite. One more try", h("pre", { class: "msg" }, result.msg)));
  });
  show.addEventListener("click", () => { status.replaceChildren(); reveal(true); });
}

function askExpr(ui) {
  const { card, el } = ui;
  const input = h("input", {
    class: "field mono", type: "text", id: "expr-answer", autocapitalize: "off", autocorrect: "off", autocomplete: "off",
    spellcheck: "false", enterkeyhint: "go", placeholder: "one expression", "aria-label": "Your expression",
  });
  add(el,
    proseEl("p", "question", card.qHtml),
    card.code ? codeBlock(card.codeHtml) : null,
    h("div", { class: "target" }, h("span", { class: "lbl" }, "Target value"), h("pre", { class: "code" }, card.target)),
    input,
  );
  runAttempts(ui, {
    kind: "expr",
    getAnswer: () => { input.value = plainPython(input.value).trim(); return input.value; },
    lockInput: () => { input.readOnly = true; },
    answerEl: () => codeBlock(card.answerHtml),
    praiseExtra: (answer) => answer.replace(/\s+/g, "") !== card.answer.replace(/\s+/g, "")
      ? h("div", { class: "stack" }, h("span", { class: "small" }, "The reference answer, for comparison:"), codeBlock(card.answerHtml)) : null,
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("#check", el)?.click(); }
  });
  focusSoon(input);
}

// ---------------------------------------------------------------- code editor (textarea + key bar)
// Edits go through execCommand when possible so Undo (shake, Cmd+Z) still works.
function insertText(ta, text, caretBack = 0) {
  if (document.activeElement !== ta) ta.focus();
  let done = false;
  try { done = document.execCommand("insertText", false, text); } catch { done = false; }
  if (!done) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
  if (caretBack) ta.selectionStart = ta.selectionEnd = ta.selectionEnd - caretBack;
}
function currentLine(ta) {
  const before = ta.value.slice(0, ta.selectionStart);
  return before.slice(before.lastIndexOf("\n") + 1);
}
function newlineWithIndent(ta) {
  const line = currentLine(ta);
  let indent = line.match(/^ */)[0];
  if (/:\s*$/.test(line)) indent += "    ";
  insertText(ta, "\n" + indent);
}
function dedent(ta) {
  const caret = ta.selectionStart;
  const lineStart = caret === 0 ? 0 : ta.value.lastIndexOf("\n", caret - 1) + 1;
  const spaces = ta.value.slice(lineStart).match(/^ {1,4}/);
  if (!spaces) return;
  if (document.activeElement !== ta) ta.focus();
  ta.setSelectionRange(lineStart, lineStart + spaces[0].length);
  let done = false;
  try { done = document.execCommand("delete", false); } catch { done = false; }
  if (!done) ta.setRangeText("", lineStart, lineStart + spaces[0].length, "start");
  const pos = Math.max(lineStart, caret - spaces[0].length);
  ta.setSelectionRange(pos, pos);
}
function moveCaret(ta, delta) {
  const pos = Math.max(0, Math.min(ta.value.length, ta.selectionStart + delta));
  ta.selectionStart = ta.selectionEnd = pos;
}
function codeEditor(id) {
  const ta = h("textarea", {
    class: "code-input", id, rows: "8", wrap: "off", autocapitalize: "off", autocorrect: "off", autocomplete: "off",
    spellcheck: "false", "aria-label": "Your code", placeholder: "def ...",
  });
  ta.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); newlineWithIndent(ta); }
    else if (e.key === "Tab" && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); e.shiftKey ? dedent(ta) : insertText(ta, "    "); }
  });
  ta.addEventListener("beforeinput", (e) => {
    if (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph") { e.preventDefault(); newlineWithIndent(ta); }
  });
  const keys = [
    ["⇥ tab", () => insertText(ta, "    "), true], ["⇤", () => dedent(ta), true],
    ["◀", () => moveCaret(ta, -1), true], ["▶", () => moveCaret(ta, 1), true],
    [":", () => insertText(ta, ":")], ["()", () => insertText(ta, "()", 1)], ["[]", () => insertText(ta, "[]", 1)],
    ["{}", () => insertText(ta, "{}", 1)], ['""', () => insertText(ta, '""', 1)], ["''", () => insertText(ta, "''", 1)],
    ["=", () => insertText(ta, "=")], ["_", () => insertText(ta, "_")], [".", () => insertText(ta, ".")],
    [",", () => insertText(ta, ",")], ["+", () => insertText(ta, "+")], ["-", () => insertText(ta, "-")],
    ["*", () => insertText(ta, "*")], ["/", () => insertText(ta, "/")], ["%", () => insertText(ta, "%")],
    ["<", () => insertText(ta, "<")], [">", () => insertText(ta, ">")], ["#", () => insertText(ta, "#")],
  ];
  const bar = h("div", { class: "keybar", role: "toolbar", "aria-label": "Code keys" });
  for (const [label, act, wide] of keys) {
    const key = h("button", { class: "key" + (wide ? " wide" : ""), type: "button", tabindex: "-1" }, label);
    const run = () => { if (ta.readOnly) return; if (document.activeElement !== ta) ta.focus(); act(); };
    let touch = null;
    // Touch: act on a tap (not a scroll of the bar) and cancel the click so the keyboard stays up.
    key.addEventListener("touchstart", (e) => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
    key.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (touch && Math.abs(t.clientX - touch.x) < 10 && Math.abs(t.clientY - touch.y) < 10) { e.preventDefault(); run(); }
      touch = null;
    });
    key.addEventListener("mousedown", (e) => e.preventDefault());  // keep focus in the editor
    key.addEventListener("click", run);
    bar.append(key);
  }
  return { ta, bar, wrap: h("div", {}, bar, ta) };
}

function askCode(ui) {
  const { card, el } = ui;
  const editor = codeEditor("code-answer");
  add(el,
    proseEl("p", "question", card.qHtml),
    card.code ? h("div", { class: "stack" }, h("span", { class: "lbl" }, "Given"), codeBlock(card.codeHtml)) : null,
    h("label", { class: "lbl", for: "code-answer" }, "Your code (Return auto-indents)"),
    editor.wrap,
  );
  runAttempts(ui, {
    kind: "code",
    getAnswer: () => { editor.ta.value = plainPython(editor.ta.value); return editor.ta.value.replace(/\s+$/, "") + "\n"; },
    lockInput: () => { editor.ta.readOnly = true; editor.bar.remove(); },
    answerEl: () => codeBlock(card.answerHtml),
    praiseExtra: () => h("div", { class: "stack" },
      h("span", { class: "small" }, `All ${plural(card.tests.length, "test")} pass. The reference solution:`), codeBlock(card.answerHtml)),
  });
}

// ---------------------------------------------------------------- summary
function renderSummary() {
  const s = state.session;
  const today = s.today;
  const total = s.results.length;
  const right = s.results.filter((r) => r.grade !== AGAIN).length;
  const pct = total ? Math.floor(100 * right / total) : 0;
  const mood = pct >= 90 ? "Amazing work." : pct >= 70 ? "Good work." : "Every miss is a memory in the making.";
  const missed = [...new Set(s.results.filter((r) => r.grade === AGAIN).map((r) => r.id))];
  const tomorrow = addDays(today, 1);
  const cards = pool();
  const mastered = cards.filter((c) => state.progress.cards[c.id]?.box === MASTERED).length;
  const dueTomorrow = dueCards(cards, tomorrow).length;
  const describe = (id) => {
    const c = BY_ID.get(id);
    return c.q ? plainText(c.q.split("\n")[0]) : "What does this print? " + c.code.split("\n")[0];
  };
  add(view,
    h("section", { class: "today" },
      h("p", { class: "eyebrow" }, s.cram ? "Practice done" : "Session done"),
      h("div", { class: "row", style: "gap:0.75rem;align-items:baseline" },
        h("span", { class: "score" }, `${right}/${total}`), h("span", { class: "muted" }, `${pct}% correct`)),
      h("p", {}, mood),
      s.cram ? h("p", { class: "small muted" }, "Practice cards don't change your schedule.")
        : h("p", { class: "small muted num" }, `${mastered}/${cards.length} mastered · ${dueTomorrow} due by tomorrow (${fmtDay(tomorrow, { weekday: "short", day: "numeric", month: "short" })})`),
      h("p", { class: "small save-status" }, saveStatusText()),
    ),
    missed.length ? h("section", {}, h("h2", {}, "Missed this time"),
      h("ul", { class: "missed" }, missed.map((id) => h("li", {}, h("span", { class: "mono small" }, id), " ", h("span", { class: "muted small" }, describe(id))))),
      h("button", { class: "btn", type: "button", onclick: () => startSession(missed.map((id) => BY_ID.get(id)), true) }, "Practice the missed cards again")) : null,
    h("button", { class: "btn primary big", type: "button", onclick: () => { state.session = null; go("home"); } }, "Back to today"),
  );
}

// ---------------------------------------------------------------- study sheet
function renderBrowse() {
  const b = state.browse;
  const topicSel = h("select", { class: "field", id: "browse-topic", "aria-label": "Topic" },
    h("option", { value: "" }, "All topics"),
    DATA.topics.map((t) => h("option", { value: t.key, selected: b.topic === t.key }, t.title)));
  const search = h("input", { class: "field", id: "browse-search", type: "search", placeholder: "Search", value: b.query,
                              autocapitalize: "off", autocorrect: "off", spellcheck: "false", "aria-label": "Search cards" });
  const list = h("div", {});
  const fill = () => {
    const q = b.query.trim().toLowerCase();
    const cards = CARDS.filter((c) => (!b.topic || c.topic === b.topic) &&
      (!q || [c.id, c.q, c.code, c.answer, c.why].join("\n").toLowerCase().includes(q)));
    list.replaceChildren(
      h("p", { class: "small muted num" }, plural(cards.length, "card")),
      ...cards.map((c) => {
        const title = plainText((c.q || c.code).split("\n")[0]);
        const body = h("div", { class: "stack" });
        if (c.kind === "concept") add(body, proseEl("p", "answer-text", c.qHtml), h("div", { class: "feedback info" }, proseEl("p", "answer-text", c.answerTextHtml)));
        if (c.kind === "output") add(body, codeBlock(c.codeHtml), h("span", { class: "lbl" }, "Output"), h("pre", { class: "code" }, c.out.join("\n")));
        if (c.kind === "expr") add(body, proseEl("p", "answer-text", c.qHtml), codeBlock(c.codeHtml), h("span", { class: "lbl" }, "Answer"),
          codeBlock(c.answerHtml), h("span", { class: "small muted" }, "→ " + c.target));
        if (c.kind === "code") add(body, proseEl("p", "answer-text", c.qHtml), c.code ? codeBlock(c.codeHtml) : null, h("span", { class: "lbl" }, "Solution"), codeBlock(c.answerHtml));
        add(body, whyEl(c));
        return h("details", { class: "sheet" },
          h("summary", {}, h("span", { class: "sum-text" }, title), h("span", { class: "kind small" }, KIND_LABEL[c.kind])), body);
      }));
  };
  topicSel.addEventListener("change", () => { b.topic = topicSel.value; fill(); });
  search.addEventListener("input", () => { b.query = search.value; fill(); });
  add(view,
    h("div", { class: "spread" }, h("h1", {}, "Study sheet"), h("button", { class: "btn ghost", type: "button", onclick: () => go("home") }, "← Today")),
    h("div", { class: "browse-tools" }, topicSel, search),
    list,
  );
  fill();
}

// ---------------------------------------------------------------- settings
function renderSettings() {
  const sizeSel = h("select", { class: "field", id: "set-size", "aria-label": "Cards per session" },
    [5, 10, 15, 20, 30, 40, 50].map((n) => h("option", { value: n, selected: state.prefs.size === n }, n)));
  const newSel = h("select", { class: "field", id: "set-new", "aria-label": "New cards per session" },
    [0, 3, 5, 8, 10, 15, 20].map((n) => h("option", { value: n, selected: state.prefs.newPer === n }, n)));
  sizeSel.addEventListener("change", () => { state.prefs.size = Number(sizeSel.value); savePrefs(); });
  newSel.addEventListener("change", () => { state.prefs.newPer = Number(newSel.value); savePrefs(); });

  const resetArea = h("div", { class: "row", "aria-live": "polite" });
  const idleReset = () => resetArea.replaceChildren(h("button", { class: "btn danger", type: "button", id: "reset", onclick: askReset }, "Reset progress"));
  const askReset = () => resetArea.replaceChildren(
    h("button", { class: "btn danger", type: "button", id: "confirm-reset", onclick: () => {
      Log.add({ k: "z" });  // a reset event: every device replays to an empty start from here
      renderStreak();
      resetArea.replaceChildren(h("p", { class: "small" }, "Progress erased. Fresh start."));
    } }, "Yes, erase everything"),
    h("button", { class: "btn ghost", type: "button", onclick: idleReset }, "Keep my progress"));
  idleReset();

  const backupArea = h("div", { class: "stack", "aria-live": "polite" });
  const showResult = (result) => backupArea.replaceChildren(
    h("div", { class: `feedback ${result.ok ? "good" : "bad"}` }, h("p", {}, result.msg)));
  const importFile = h("input", { type: "file", id: "import-file", accept: ".json,application/json,text/plain", hidden: true });
  importFile.addEventListener("change", () => {
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => showResult(importProgress(String(reader.result)));
    reader.onerror = () => showResult({ ok: false, msg: "Couldn't read that file. Try Paste a backup instead." });
    reader.readAsText(file);
    importFile.value = "";
  });
  const showPaste = () => {
    const box = h("textarea", { class: "field mono", id: "paste-backup", rows: "5", autocapitalize: "off", autocorrect: "off",
                                spellcheck: "false", placeholder: '{"version": 1, "cards": {…}, "history": {…}}', "aria-label": "Paste your backup" });
    backupArea.replaceChildren(box, h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", onclick: () => showResult(importProgress(box.value)) }, "Import")));
    focusSoon(box);
  };
  const shown = Sync.state === "local" && !state.localOk ? "none" : Sync.state;

  add(view,
    h("div", { class: "spread" }, h("h1", {}, "Settings"), h("button", { class: "btn ghost", type: "button", onclick: () => go("home") }, "← Today")),
    h("section", {},
      h("div", { class: "setting" }, h("label", { for: "set-size" }, "Cards per session"), sizeSel),
      h("div", { class: "setting" }, h("label", { for: "set-new" }, "New cards per session"), newSel),
    ),
    h("section", {},
      h("h2", {}, "Checking answers"),
      h("p", { class: "muted" }, "One-liners and code are checked by running real Python (Pyodide) in your browser. It downloads about 14 MB the first time, so you may want to load it on Wi-Fi."),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => Py.start() }, "Load Python now"), pyStatusEl()),
      h("p", { class: "small muted pyreason", hidden: Py.state !== "failed" },
        Py.state === "failed" ? `Python couldn't start: ${Py.reason}. Until you reload, you grade one-liners and code yourself.` : ""),
    ),
    h("section", {},
      h("h2", {}, "Your progress"),
      h("p", { class: `note save-status${shown === "none" || shown === "full" ? " warn" : ""}` }, saveStatusText()),
      h("p", { class: "muted" }, "Every answer is saved the moment you grade it: in this browser and, when you're signed in, to your account, so it follows you between devices. Studying on two devices at once is fine; their progress is combined."),
      h("h3", {}, "Backup"),
      h("p", { class: "muted" }, "Export a copy of your progress any time. The file also works with the terminal version (save it as ~/.pymem_progress.json), and you can import the terminal's file here."),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", id: "export", onclick: () => exportProgress(backupArea) }, "Export backup"),
        h("label", { class: "btn", for: "import-file", id: "import", tabindex: "0",
                     onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); importFile.click(); } } }, "Import from file"),
        h("button", { class: "btn ghost", type: "button", onclick: showPaste }, "Paste a backup")),
      importFile,
      backupArea,
      h("h3", {}, "Start over"),
      resetArea,
    ),
    h("section", {},
      h("h2", {}, "How it works"),
      h("p", { class: "muted" }, "Each card sits in a box from 0 to 5. A right answer moves it up a box and you see it less often (1, 3, 7, 14, then 30 days). A miss sends it back to box 0, and it returns later in the same session."),
    ),
  );
}

// ---------------------------------------------------------------- keyboard shortcuts (hardware keyboards)
document.addEventListener("keydown", (e) => {
  if (state.view !== "session" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const btn = document.querySelector(`.grade[data-grade="${e.key}"]`);
  if (btn) { e.preventDefault(); btn.click(); }
});

// ---------------------------------------------------------------- boot
function start(saved) {
  Log.init();
  const s = saved && saved.session;
  if (s && Array.isArray(s.queue) && s.queue.length && s.queue.every((id) => BY_ID.has(id)) &&
      Number.isInteger(s.index) && Array.isArray(s.results) && Array.isArray(s.retried) && typeof s.today === "string") {
    state.session = Object.assign({}, s, { undo: null });
    state.view = saved.view === "summary" || s.index >= s.queue.length ? "summary" : "session";
    if (s.queue.some((id) => ["expr", "code"].includes(BY_ID.get(id).kind))) Py.start();
  }
  render();
  Sync.init();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === "function") {
  try { hot.snapshot(() => ({ view: state.view, session: state.session ? Object.assign({}, state.session, { undo: null }) : null })); } catch { /* optional */ }
}
if (hot && typeof hot.ready === "function") hot.ready((data) => start(data || {}));
else start((hot && hot.data) || {});
</script>
